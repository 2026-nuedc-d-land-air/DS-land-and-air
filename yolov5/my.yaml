
# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: F:/short_term/yolov5/datasets  # dataset root dir
train: F:/short_term/yolov5/datasets/images/train  # train images (relative to 'path') 128 images
val: F:/short_term/yolov5/datasets/images/val  # val images (relative to 'path') 128 images
test:  # test images (optional)

# Classes
nc: 2  # number of classes
names: ['object','object2']  # class names

